; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Board: Waveshare ESP32-C6-LCD-1.47 (ESP32-C6FH4, 4 MB flash, ST7789 172x320)
; https://docs.waveshare.com/ESP32-C6-LCD-1.47

[env:esp32-c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The devkitc-1 board definition assumes 8 MB flash; this board has 4 MB.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; 1.9 MB app slots (x2, so OTA updates stay possible), 128 KB SPIFFS.
board_build.partitions = min_spiffs.csv

build_flags =
    ; The board has no USB-UART chip: Serial goes over the C6's native USB.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    bblanchon/ArduinoJson@^7.2.0
    olikraus/U8g2@^2.35.0  ; fonts only, drawn through GFX Library

; Same firmware, but the train tracker shows canned arrivals (src/apps/train_sample_data.cpp)
; instead of calling CTA: no API key or stop needed. Steps through a new scenario on each poll.
;   pio run -e esp32-c6-sample -t upload
[env:esp32-c6-sample]
extends = env:esp32-c6
build_flags =
    ${env:esp32-c6.build_flags}
    -DTRAIN_SAMPLE_DATA
